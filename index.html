<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/branding/zensys-logo.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1d4ed8" />
    <script>
      (() => {
        try {
          const storedLevel = localStorage.getItem("pos_animation_level");
          const validLevel = ["off", "balanced", "high"].includes(storedLevel);
          document.documentElement.dataset.animationLevel = validLevel
            ? storedLevel
            : matchMedia("(prefers-reduced-motion: reduce)").matches ? "off" : "balanced";
        } catch {
          document.documentElement.dataset.animationLevel = "balanced";
        }

        // Theme, stamped before first paint so a dark till never flashes white.
        // Default is light: dark is a choice a person makes, never inherited
        // from the operating system unless they pick "System" themselves.
        try {
          const stored = localStorage.getItem("pos_theme");
          const choice = ["system", "light", "dark"].includes(stored) ? stored : "light";
          const resolved = choice === "system"
            ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
            : choice;
          document.documentElement.dataset.theme = resolved;
          document.documentElement.style.colorScheme = resolved;
        } catch {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <title>ZenSys POS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
